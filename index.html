<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <main>
        <h1>Weather Forecast</h1>
        <div class="search-container">
            <input type="text" class="location" placeholder="Enter the place">
            <button class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <p class="weather-type"></p>
        <div class="present-location">
            <i class="fa-solid fa-location-dot"></i>
            <p class="location-name" style="display : inline"></p>
        </div>
        <div class="weather-container">
            <div class="weather-logo">
                <i class="fa-solid fa-cloud-sun"></i>
            </div>
            <div class="weather-celsius">
            </div>
        </div>
        <div class="advice-header">Things To Do</div>
        <div class="things-container">
            <div class="todo">
                <p class="number">1</p>
                <p class="advice">Perfect outdoor weather</p>
            </div>
            <div class="todo">
                <p class="number">2</p>
                <p class="advice">Go for cycling</p>
            </div>
            <div class="todo">
                <p class="number">3</p>
                <p class="advice">Stay lightly hydrated</p>
            </div>
            <div class="todo">
                <p class="number">4</p>
                <p class="advice">Wear comfortable clothes</p>
            </div>
            <div class="todo">
                <p class="number">5</p>
                <p class="advice">Enjoy fresh air</p>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
